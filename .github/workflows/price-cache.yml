name: Scheduled Price Cache

on:
  schedule:
    # 00:30 UTC = 06:00 IST (fuel prices change early morning) and
    # 12:30 UTC = 18:00 IST. GitHub may start cron jobs a few minutes late.
    - cron: '30 0 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-price-cache
  cancel-in-progress: false

jobs:
  refresh-price-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Refresh city price cache from GoodReturns
        # Uses the built-in list of ~60 Indian cities; override with
        # PRICE_CACHE_CITIES if you want a different set.
        working-directory: backend
        run: python refresh_cache.py
      - name: Commit refreshed cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/data/price_cache.json
          git diff --cached --quiet || git commit -m 'chore: refresh scheduled price cache'
          git push
