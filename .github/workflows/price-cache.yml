name: Scheduled Price Cache

on:
  schedule:
    # 00:30 UTC = 06:00 IST (fuel prices change early morning) and
    # 12:30 UTC = 18:00 IST. GitHub may start cron jobs a few minutes late.
    - cron: '30 0 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-price-cache
  cancel-in-progress: false

jobs:
  refresh-price-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      # Rebuild the bundled PIN -> district/state/coordinates index (~19,600 PINs).
      - name: Build PIN code index
        working-directory: backend
        run: |
          pip install --quiet indiapins
          python build_pincodes.py
      - name: Refresh city + state price cache from GoodReturns
        # Cities come from the built-in list; the state-wise table gives every
        # state's rate, so any PIN code in India resolves to its state's price.
        working-directory: backend
        run: python refresh_cache.py
      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/data/price_cache.json backend/data/pincodes.json
          git diff --cached --quiet || git commit -m 'chore: refresh price cache and PIN code index'
          git push
