name: Flutter CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true
      - name: Generate platform folders for CI
        run: flutter create --platforms=android,ios --project-name live_location_based_price .
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - name: Add Android location permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
          if permission not in text:
              end = text.find('>')
              text = text[:end + 1] + '\n    ' + permission + text[end + 1:]
              manifest.write_text(text)
          PY
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: live-location-based-price-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
