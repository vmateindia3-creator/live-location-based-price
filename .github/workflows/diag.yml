name: Diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - name: Probe sources
        run: |
          python - <<'PY'
          import requests
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"}

          def probe(name, url, params=None, headers=None):
              try:
                  r = requests.get(url, params=params, headers=headers, timeout=15)
                  print(f"{name}: status={r.status_code} len={len(r.text)} head={r.text[:120]!r}")
              except Exception as e:
                  print(f"{name}: FAIL {type(e).__name__}: {e}")

          # 1. Open-Meteo, as the backend calls it (no UA), then with a UA.
          probe("open-meteo (no UA)", "https://api.open-meteo.com/v1/forecast",
                {"latitude": 31.10, "longitude": 77.17, "current": "temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code", "timezone": "auto"})
          probe("open-meteo (UA)", "https://api.open-meteo.com/v1/forecast",
                {"latitude": 31.10, "longitude": 77.17, "current": "temperature_2m", "timezone": "auto"}, UA)
          probe("open-meteo (Shimla vs Chennai check)", "https://api.open-meteo.com/v1/forecast",
                {"latitude": 13.08, "longitude": 80.27, "current": "temperature_2m", "timezone": "auto"}, UA)

          # 2. wttr.in as a possible fallback provider
          probe("wttr.in", "https://wttr.in/Shimla?format=j1", headers=UA)

          # 3. BankBazaar state LPG page (can we fetch it at all?)
          probe("bankbazaar maharashtra", "https://www.bankbazaar.com/gas-connection/lpg-price-in-maharashtra.html", headers=UA)
          probe("bankbazaar telangana", "https://www.bankbazaar.com/gas-connection/lpg-price-in-telangana.html", headers=UA)
          probe("bankbazaar today", "https://www.bankbazaar.com/gas-connection/lpg-price-today.html", headers=UA)
          PY
