name: Flutter CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true
      - name: Generate platform folders for CI
        run: flutter create --platforms=android,ios --project-name live_location_based_price .
      - name: Set app display name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="live_location_based_price"', 'android:label="LocaRate"')
          manifest.write_text(text)
          plist = Path('ios/Runner/Info.plist')
          t = plist.read_text()
          if '<key>CFBundleDisplayName</key>' not in t:
              entry = '\t<key>CFBundleDisplayName</key>\n\t<string>LocaRate</string>\n'
              t = t.replace('</dict>', entry + '</dict>', 1)
              plist.write_text(t)
          PY
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - name: Add Android location permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
          ]
          end = text.find('>')
          additions = ''.join(f'\n    {permission}' for permission in permissions if permission not in text)
          if additions:
              manifest.write_text(text[:end + 1] + additions + text[end + 1:])
          PY
      - name: Add iOS location usage description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          plist = Path('ios/Runner/Info.plist')
          text = plist.read_text()
          key = '<key>NSLocationWhenInUseUsageDescription</key>'
          if key not in text:
              marker = '</dict>'
              entry = '    <key>NSLocationWhenInUseUsageDescription</key>\n    <string>LocaRate uses your location to show local weather and prices.</string>\n'
              plist.write_text(text.replace(marker, entry + marker, 1))
          PY
      - name: Add test AdMob application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />'
          if meta not in text:
              start = text.find('<application')
              end = text.find('>', start)
              text = text[:end + 1] + '\n        ' + meta + text[end + 1:]
              manifest.write_text(text)
          PY
      # Release APKs are much smaller than the debug universal build, so they
      # download and install far more reliably. Signed with the debug key until
      # a production keystore is added.
      - name: Build release APKs (per-ABI + universal)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: locarate-release-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-release.apk
