name: Diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Probe pages
        working-directory: backend
        run: |
          python - <<'PY'
          import requests, re, app
          urls = [
              ("https://www.goodreturns.in/lpg-price-in-gorakhpur.html", "Gorakhpur", "Uttar Pradesh"),
              ("https://www.goodreturns.in/lpg-price-in-faizabad.html", "Ayodhya", "Uttar Pradesh"),
              ("https://www.goodreturns.in/lpg-price-in-ayodhya.html", "Ayodhya", "Uttar Pradesh"),
              ("https://www.goodreturns.in/petrol-price-in-varanasi.html", "Varanasi", "Uttar Pradesh"),
          ]
          for url, city, state in urls:
              try:
                  r = requests.get(url, headers=app.HEADERS, timeout=15)
                  text = app.goodreturns_text(r.text)
              except Exception as e:
                  print("FETCH FAIL", url, e); continue
              print("URL:", url)
              print("  status:", r.status_code, "textlen:", len(text))
              print("  HEAD:", text[:420].replace("\n", " "))
              print("  label present:", ("cylinder price in " + city) in text, "| petrol label:", ("petrol price in " + city) in text)
              print("  city_headline lpg:", app.city_headline_value("lpg", text, city))
              print("  parse_fuel lpg:", app.parse_fuel_value("lpg", text, city, state))
              print("  headline names:", app.headline_names(city))
              print("  ---")
          PY
