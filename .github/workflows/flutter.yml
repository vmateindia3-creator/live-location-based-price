name: Flutter CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Generate platform folders for CI
        run: flutter create --platforms=android,ios --project-name live_location_based_price .
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
